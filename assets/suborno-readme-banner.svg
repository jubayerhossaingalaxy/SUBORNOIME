<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Suborno — Native Bangla Input Method</title>
  <desc id="desc">A modern gradient banner with Bengali keycaps and flowing keyboard-inspired lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101B3D"/>
      <stop offset=".52" stop-color="#173F67"/>
      <stop offset="1" stop-color="#442B73"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DE2D0"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".06"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#071126" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="390" rx="28" fill="url(#bg)"/>
  <circle cx="1035" cy="68" r="175" fill="#2DE2D0" opacity=".08"/>
  <circle cx="1110" cy="340" r="220" fill="#A78BFA" opacity=".10"/>
  <path d="M0 300 C220 245 330 370 570 290 S920 215 1200 285" fill="none" stroke="url(#glow)" stroke-width="2" opacity=".28"/>
  <path d="M0 326 C230 268 360 390 610 315 S970 245 1200 316" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".12"/>
  <g opacity=".22" fill="none" stroke="#B8F7F0">
    <path d="M760 65h90m-45-45v90"/>
    <circle cx="760" cy="65" r="28"/>
    <circle cx="1120" cy="250" r="42"/>
    <path d="M1080 250h80M1120 210v80"/>
  </g>
  <g transform="translate(78 78)">
    <rect width="7" height="208" rx="3.5" fill="url(#glow)"/>
    <text x="34" y="28" fill="#9BEDE5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4">NATIVE BANGLA INPUT METHOD</text>
    <text x="30" y="116" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">Suborno</text>
    <text x="34" y="163" fill="#DCEBFF" font-family="Segoe UI, Arial, sans-serif" font-size="25">A natural Bangla typing experience for Windows</text>
    <rect x="34" y="190" width="204" height="4" rx="2" fill="url(#glow)"/>
    <text x="34" y="226" fill="#B9CBE7" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="2">C++20  •  UNICODE  •  WINDOWS TSF</text>
  </g>
  <g filter="url(#shadow)" transform="translate(790 112)">
    <g>
      <rect x="0" y="0" width="104" height="104" rx="19" fill="url(#key)" stroke="#C8F8F3" stroke-opacity=".45"/>
      <text x="52" y="69" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans Bengali, Segoe UI, sans-serif" font-size="55">অ</text>
    </g>
    <g transform="translate(124 0)">
      <rect width="104" height="104" rx="19" fill="url(#key)" stroke="#C8F8F3" stroke-opacity=".45"/>
      <text x="52" y="69" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans Bengali, Segoe UI, sans-serif" font-size="55">ক</text>
    </g>
    <g transform="translate(0 124)">
      <rect width="104" height="104" rx="19" fill="url(#key)" stroke="#C8F8F3" stroke-opacity=".45"/>
      <text x="52" y="69" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans Bengali, Segoe UI, sans-serif" font-size="55">া</text>
    </g>
    <g transform="translate(124 124)">
      <rect width="104" height="104" rx="19" fill="url(#key)" stroke="#C8F8F3" stroke-opacity=".45"/>
      <text x="52" y="69" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans Bengali, Segoe UI, sans-serif" font-size="55">ি</text>
    </g>
  </g>
  <text x="1125" y="360" text-anchor="end" fill="#C7D6F0" opacity=".7" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="2">SUBORNOIME</text>
</svg>