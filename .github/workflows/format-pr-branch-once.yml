name: Format PR branch once

on:
  push:
    branches:
      - optimize/remove-unused-icu-i18n

permissions:
  contents: write

concurrency:
  group: one-time-format-{{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Install pinned LLVM 23
        run: scripts/install-llvm-23-ubuntu.sh

      - name: Format repository C++ sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sources < <(
            find include src tests benchmarks -type f \\
              \\( -name '*.h' -o -name '*.hpp' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \\
              -print0
          )
          if (("${#sources[@]}")) == 0; then
            printf 'ERROR: no C++ source files found.\\n' >&2
            exit 1
          fi
          clang-format-23 -i "${sources[@]}"

      - name: Commit formatting changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'All C++ files already match clang-format 23.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- include src tests benchmarks
          git commit -m 'style: apply clang-format 23'
          git push origin "HEAD:${GITHUB_REF_NAME}"
