name: One-time clang-format

on:
  push:
    branches:
      - optimize/remove-unused-icu-i18n

permissions:
  contents: write

jobs:
  format:
    name: Format all C++ sources with pinned LLVM 23
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: optimize/remove-unused-icu-i18n

      - name: Install pinned clang-format 23
        run: scripts/install-llvm-23-ubuntu.sh

      - name: Format C++ sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sources < <(
            find include src tests benchmarks -type f \
              \( -name '*.h' -o -name '*.hpp' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \) \
              -print0
          )
          clang-format-23 -i "${sources[@]}"

      - name: Commit formatting changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "All C++ files already match the clang-format 23 policy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include src tests benchmarks
          git commit -m "style: apply clang-format 23 to new implementation"
          git push origin HEAD:optimize/remove-unused-icu-i18n
